<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep obsidian-violet studio background gradient -->
    <linearGradient id="rc-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151324" />
      <stop offset="50%" stop-color="#0a0912" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Ambient top-left brand aura -->
    <radialGradient id="rc-aura" cx="18%" cy="14%" r="78%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#d946ef" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border rim highlight -->
    <linearGradient id="rc-rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#7c5cff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.22" />
    </linearGradient>

    <!-- Primary R-Pillar & Loop (Pure White to Ice Violet) -->
    <linearGradient id="rc-pillar" x1="128" y1="116" x2="360" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dcd7ff" />
    </linearGradient>

    <!-- R-Leg Velocity Diagonal (Violet-Magenta Gradient) -->
    <linearGradient id="rc-leg" x1="230" y1="260" x2="392" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <filter id="rc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7c5cff" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#rc-bg)" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#rc-aura)" />
  <rect x="18" y="18" width="476" height="476" rx="114" stroke="url(#rc-rim)" stroke-width="4" />

  <!-- Subtle Core Orbit Ring -->
  <circle cx="256" cy="256" r="186" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" />

  <!-- RepCore Studio Geometric "R + Core Node" Monogram -->
  <g filter="url(#rc-glow)">
    <!-- Forward Velocity Leg of the R -->
    <path d="M236 268H314L394 396H308L236 268Z" fill="url(#rc-leg)" />

    <!-- Architectural R Stem & Upper Loop -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M132 116H282C339.4 116 382 154.5 382 206C382 257.5 339.4 296 282 296H208V396H132V116ZM208 180V232H276C296.5 232 310 221 310 206C310 191 296.5 180 276 180H208Z" fill="url(#rc-pillar)" />

    <!-- Glowing "Core" Diamond Node inside the R Counter -->
    <path d="M254 182L278 206L254 230L230 206L254 182Z" fill="#d946ef" />
  </g>
</svg>

